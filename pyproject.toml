[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-project"
version = "0.1.0"
description = "Reproducible expressive piano continuation experiments"
requires-python = ">=3.11"
dependencies = [
  "mido>=1.3,<2",
  "numpy>=2,<3",
  "PyYAML>=6,<7",
  "matplotlib>=3.10,<4",
  "filelock>=3,<4",
  "ariautils @ git+https://github.com/EleutherAI/aria-utils.git@7c815755c6889a784b6a1b3343e9e8daa3e7d128",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
pretrained = ["safetensors>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"music_project.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

