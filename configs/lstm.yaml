name: lstm-pilot
seed: 42
device: cuda
precision: bf16
deterministic: false
data:
  token_summary: outputs/tokenization-summary.json
  manifest: data/manifests/maestro-v3-clean.jsonl
model:
  kind: lstm
  width: 256
  layers: 1
  dropout: 0.1
training:
  context_length: 2048
  microbatch: 1
  accumulation: 16
  token_budget: 5000000

