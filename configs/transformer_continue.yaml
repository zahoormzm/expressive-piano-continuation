name: transformer-continued-150m
seed: 42
device: cuda
precision: bf16
deterministic: false
data:
  token_summary: outputs/tokenization-full-summary.json
  manifest: data/manifests/maestro-v3-clean.jsonl
model:
  kind: transformer
  width: 512
  layers: 8
  heads: 8
  feedforward: 1536
  dropout: 0.1
  tied_embeddings: true
  gradient_checkpointing: false
training:
  context_length: 2048
  microbatch: 4
  accumulation: 4
  token_budget: 50000000
  learning_rate: 0.00006
  warmup_fraction: 0
  minimum_lr_fraction: 0.5
  validation_every: 200
  checkpoint_every: 200
  validation_windows_per_piece: 4
